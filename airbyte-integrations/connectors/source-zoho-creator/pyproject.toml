[project]
name = "source-zoho-creator"
version = "0.1.0"
description = "Airbyte connector to pull data from Zoho Creator Applications, using Zoho Creator Data API"
authors = [
    {name = "Ritabrata Roy",email = "royred88@gmail.com"}
]
license = {text = "MIT License"}
readme = "README.md"
requires-python = "<3.14,>=3.10"
dependencies = [
    "airbyte-cdk (>=7.5.0,<8.0.0)",
    "pytest (>=9.0.1,<10.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
