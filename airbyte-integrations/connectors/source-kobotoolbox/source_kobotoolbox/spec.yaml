documentationUrl: https://docs.airbyte.com/integrations/sources/kobotoolbox
connectionSpecification:
  $schema: http://json-schema.org/draft-07/schema#
  title: Kobotoolbox Spec
  type: object
  additionalProperties: true
  required:
    - base_url
    - token
  properties:
    username:
      type: string
      title: Username
      description: Username to authenticate into the KoboToolBox server
      order: 1
    password:
      type: string
      title: Password
      description: Password to authenticate into the KoboToolBox server
      airbyte_secret: true
      order: 2
    token:
      type: string
      title: API Token
      description: Personal API token for the KoboToolBox server. If set, username/password are not required.
      airbyte_secret: true
      order: 3
    base_url:
      type: string
      title: Base Url
      description: Base url for the kobo server
      enum:
        - https://kf.kobotoolbox.org
        - https://kobo.humanitarianresponse.info
        - https://eu.kobotoolbox.org
      order: 4
    start_time:
      type: string
      title: Start Time
      description: Any data before this date will not be replicated.
      default: "2023-03-15T00:00:00"
      order: 5
      pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}$
    asset_uid:
      type: string
      title: Asset UID
      description: If set, only sync this single Kobo asset/form (by UID) instead of syncing all deployed forms.
      order: 6
    exclude_fields:
      type: array
      title: Exclude Fields
      description: Column names not to sync
      order: 7
    forms_using_endtime:
      type: array
      title: Forms Using Endtime
      description: List of forms that use endtime instead of submission time
      order: 8
    forms_using_end:
      type: array
      title: Forms Using End
      description: List of forms that use end instead of submission time
      order: 9
    max_days_to_close:
      type: integer
      title: Max Days To Close
      description: The maximum number of days between a form's submission date and end date, for those forms listed above
      default: 30
      order: 10
    label_fields:
      type: boolean
      title: Label Fields
      description: If true, also emit a `data_labeled` object with human-readable question labels and choice labels.
      default: false
      order: 11
    label_language_index:
      type: integer
      title: Label Language Index
      description: Index into Kobo label arrays (used when forms have multiple languages).
      default: 0
      order: 12